[project]
name = "twin-server"
version = "0.1.0"
description = "TWIN exocortex brain: Claude agent loop + markdown memory"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "anthropic>=0.40",
    "apscheduler>=3.10",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["twin_server*"]

[tool.setuptools.package-data]
twin_server = ["prompts/*.md"]
